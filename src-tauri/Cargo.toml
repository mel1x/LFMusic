[package]
name = "lfmusic"
version = "1.0.0"
description = "Desktop Music App for local saved library"
authors = ["melix"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lf_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
lofty = "0.22"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rayon = "1.10"
# Оптимизированный БПФ (SIMD: SSE/AVX/NEON) для реал-тайм визуализатора спектра.
rustfft = "6"
# HTTP-клиент для внешних источников метаданных (iTunes/Deezer/MusicBrainz).
# rustls вместо native-tls — без системного OpenSSL, собирается и на Android.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
# Проверка целостности скачанных бинарей (yt-dlp) по SHA256 из релиза.
sha2 = "0.10"

# Десктоп-зависимости (не Android/iOS).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Discord Rich Presence — IPC с локальным клиентом Discord.
discord-rich-presence = "0.2.5"
# Распаковка zip-архивов (страница «Скачивание»): ffmpeg на Windows
# (FFmpeg-Builds) и macOS (evermeet.cx); Deno (JS-движок для yt-dlp) на всех
# десктоп-платформах распространяется в zip (на Linux ffmpeg идёт в tar.xz,
# см. tar/lzma-rs ниже, а Deno — в zip, поэтому zip нужен и здесь).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Системное медиа-управление на Linux (MPRIS). use_zbus — чистый Rust,
# без системной зависимости libdbus.
[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Распаковка tar.xz-сборок ffmpeg (FFmpeg-Builds) для страницы «Скачивание».
# lzma-rs — чистый Rust xz-декодер (без системного liblzma), tar — чтение архива.
tar = "0.4"
lzma-rs = "0.3"

[target.'cfg(windows)'.dependencies]
# In-app updates from GitHub releases (signed NSIS/MSI installers + latest.json).
tauri-plugin-updater = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Media",
    "Win32_Storage_Xps",
    "Win32_System_Power",
] }

# Dev-сборка: зависимости (image, lofty, symphonia и т.п.) в debug медленнее
# в десятки раз — отсюда лаги анимаций превью и декода обложек при `tauri dev`.
[profile.dev]
opt-level = 1
# Инкрементальная компиляция при opt-level>0 на Windows/MSVC периодически даёт
# ошибки линковки (LNK2019 на anon.*.llvm.* — рассинхрон между codegen-units).
# Отключаем: крейт пересобирается целиком, зато линковка стабильна.
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
